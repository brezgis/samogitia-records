<!doctype html>
<!-- This was the shelf of books. Books are now chosen from the menu inside every book, so this
     address only leads on into a book, the same way the repository's root index.html does, keeping
     whatever followed it in the address (old links, #lang=...). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Žemaičių metrikai</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://samogitia.brezgis.com/site/book/">
<noscript><meta http-equiv="refresh" content="0; url=book/"></noscript>
<style>html { background: #d5d8cf; } body { margin: 0; background: #d5d8cf; color: #22201c; font: 17px/1.5 Georgia, serif; display: grid; place-items: center; min-height: 100vh; } a { color: #8a2420; }</style>
</head>
<body><noscript><p><a href="book/">Open the register.</a></p></noscript>
<script src="library.js"></script>
<script>
(function () {
  var dirs = [];
  try {
    window.LIBRARY.parishes.forEach(function (p) { p.books.forEach(function (b) { if (b.start && b.state === 'open') dirs.push(b.dir); }); });
  } catch (e) {}
  var named = /(^|[#&])(s|pick)=/.test(location.hash);
  var dir = named || !dirs.length ? 'book' : dirs[Math.floor(Math.random() * dirs.length)];
  location.replace('' + dir + '/' + location.search + location.hash);
})();
</script>
</body>
</html>
